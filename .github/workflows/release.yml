name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # 允许创建/更新 Release 和上传资产

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the git tag must match the binary version baked into CMakeLists.txt
  # (single source of truth). A drift would ship binaries reporting the wrong
  # version ("update never applies" or an endless update loop). The tag is
  # compared after stripping the 'v' prefix and any '-prerelease' suffix, since
  # project(VERSION) only accepts plain numeric versions.
  verify-version:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify tag matches project VERSION
        run: |
          CMAKE_VERSION=$(grep -oP 'project\(ModbusTools VERSION \K[0-9.]+' CMakeLists.txt)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          echo "project VERSION=${CMAKE_VERSION}; tag ${GITHUB_REF_NAME} -> ${TAG_VERSION}"
          if [ -z "$CMAKE_VERSION" ] || [ "$CMAKE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::git tag '${GITHUB_REF_NAME}' does not match project VERSION '${CMAKE_VERSION}' in CMakeLists.txt"
            exit 1
          fi

  build-and-release:
    needs: verify-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSVC ASan Component
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Start-Process -FilePath "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" -ArgumentList "-E", "sleep", "5" -Wait # Just a dummy to ensure installer is ready
          # Note: On GitHub Actions, we typically use the pre-installed components. 
          # If ASan is missing, we use the VS Installer CLI:
          # Start-Process -Wait -FilePath "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList "modify", "--installPath", "`"$vsPath`"", "--add", "Microsoft.VisualStudio.Component.VC.ASAN", "--passive", "--norestart"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3' # Qt6, unified with ci.yml (was 6.10.1, fixed for cross-platform consistency)
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: "qtserialport qtcharts"
          cache: 'true'

      - name: Build & Run Tests (QA Check - ASan Enabled)
        shell: bash
        run: |
          cmake -S . -B build_qa -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMODBUS_TOOLS_BUILD_TESTS=ON -DMODBUS_TOOLS_ENABLE_ASAN=ON
          cmake --build build_qa --config RelWithDebInfo -j
          cd build_qa
          ctest -C RelWithDebInfo --output-on-failure

      - name: Build Production Artifacts (Delivery - Clean Release, two-stage)
        shell: bash
        run: |
          # Use a separate directory to ensure zero contamination
          cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release -DMODBUS_TOOLS_BUILD_TESTS=OFF -DMODBUS_TOOLS_ENABLE_ASAN=OFF

          # Stage 1: build the updater first so its binary hash can be burned
          # into the main application (verifyUpdaterIntegrity depends on it).
          cmake --build build_release --target updater --config Release -j
          UPDATER_EXE="build_release/app/Release/updater.exe"
          if [ ! -f "$UPDATER_EXE" ]; then
            echo "::error::updater.exe not found at $UPDATER_EXE after stage-1 build"
            exit 1
          fi
          UPDATER_HASH=$(sha256sum "$UPDATER_EXE" | cut -d' ' -f1)
          if [ -z "$UPDATER_HASH" ]; then
            echo "::error::failed to compute updater.exe SHA256"
            exit 1
          fi
          echo "updater.exe SHA256: $UPDATER_HASH"

          # Stage 2: re-configure with the injected hash and build the bundle.
          cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release \
                -DMODBUS_TOOLS_BUILD_TESTS=OFF -DMODBUS_TOOLS_ENABLE_ASAN=OFF \
                -DMODBUS_TOOLS_UPDATER_SHA256="$UPDATER_HASH"
          CONFIGURED_HASH=$(cmake -S . -B build_release -LA -N | grep -i 'MODBUS_TOOLS_UPDATER_SHA256' || true)
          case "$CONFIGURED_HASH" in
            *"$UPDATER_HASH"*) ;;
            *) echo "::error::MODBUS_TOOLS_UPDATER_SHA256 was not injected into the build cache: $CONFIGURED_HASH"; exit 1 ;;
          esac
          cmake --build build_release --target release_bundle --config Release -j

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          # Define Tag Name
          $TAG_NAME = "${{ github.ref_name }}"
          
          # Paths
          $BUILD_DIR = "build_release/app/Release"
          $RELEASE_DIR = "release_pkg"
          $ZIP_NAME = "Modbus-Tools-$TAG_NAME-windows-x86_64.zip"
          $SINGLE_EXE_NAME = "Modbus-Tools-$TAG_NAME-windows-x86_64-UpdateOnly.exe"
          
          # Create Release Directory via CMake Install
          # This ensures ONLY 'Production' component artifacts are included
          cmake --install build_release --prefix $RELEASE_DIR --component Production --config Release
          
          # Artifact A: Full Package (ZIP)
          # (Executables are already in $RELEASE_DIR via install)
          
          # Run windeployqt
          windeployqt --release "$RELEASE_DIR/Modbus-Tools.exe"
          
          $SYSTEM32 = "C:\Windows\System32"
          Copy-Item "$SYSTEM32\msvcp140.dll" -Destination $RELEASE_DIR -ErrorAction SilentlyContinue
          Copy-Item "$SYSTEM32\vcruntime140.dll" -Destination $RELEASE_DIR -ErrorAction SilentlyContinue
          Copy-Item "$SYSTEM32\vcruntime140_1.dll" -Destination $RELEASE_DIR -ErrorAction SilentlyContinue

          Remove-Item -Path "$RELEASE_DIR\vc_redist.x64.exe" -Force -ErrorAction SilentlyContinue

          # Compress to ZIP
          Compress-Archive -Path "$RELEASE_DIR/*" -DestinationPath $ZIP_NAME
          
          # Artifact B: Single Executable (Update Only)
          Copy-Item -Path "$BUILD_DIR/Modbus-Tools.exe" -Destination $SINGLE_EXE_NAME
          
          # Calculate SHA256
          $ZipHash = (Get-FileHash -Algorithm SHA256 -Path $ZIP_NAME).Hash.ToLower()
          $ExeHash = (Get-FileHash -Algorithm SHA256 -Path $SINGLE_EXE_NAME).Hash.ToLower()
          
          # Save hashes to files
          Set-Content -Path "$ZIP_NAME.sha256" -Value "$ZipHash  $ZIP_NAME"
          Set-Content -Path "$SINGLE_EXE_NAME.sha256" -Value "$ExeHash  $SINGLE_EXE_NAME"

      - name: Get Tag Message
        id: tag_message
        shell: bash
        run: |
          git fetch --tags --force
          BODY=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_message.outputs.body }}
          draft: false
          files: |
            Modbus-Tools-*-windows-x86_64.zip
            Modbus-Tools-*-windows-x86_64-UpdateOnly.exe
            *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux full-package (tar.gz) build & publish. Update UX on Linux is
  # "detect + terminal command guidance" (see docs: linux-ota-implementation-plan.md),
  # so no UpdateOnly counterpart is produced for this platform.
  build-linux:
    needs: verify-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # glibc 2.35 baseline (Ubuntu 22.04/24.04, Debian 12+); never pin runs-on —
    # the container image, not the host, defines the ABI baseline.
    container: ubuntu:22.04
    steps:
      - name: Install Toolchain & Dependencies (no sudo inside container)
        run: |
          apt-get update && apt-get install -y \
            git ca-certificates gpg wget \
            build-essential ninja-build patchelf file \
            libgl1-mesa-dev libegl1-mesa-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install CMake (Kitware APT)
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update && apt-get install -y cmake
          cmake --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: "qtserialport qtcharts"

      - name: Build & Run Tests (QA Check - ASan Enabled)
        run: |
          cmake -S . -B build_qa -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DMODBUS_TOOLS_BUILD_TESTS=ON -DMODBUS_TOOLS_ENABLE_ASAN=ON
          cmake --build build_qa -j
          ctest --test-dir build_qa --output-on-failure

      - name: Build Production Artifacts (Delivery - Clean Release)
        run: |
          # Use a separate directory to ensure zero contamination
          cmake -S . -B build_release -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DMODBUS_TOOLS_BUILD_TESTS=OFF -DMODBUS_TOOLS_ENABLE_ASAN=OFF
          cmake --build build_release --target release_bundle -j

      - name: Package tar.gz (Qt runtime + $ORIGIN rpath)
        run: bash scripts/packaging/deploy-linux.sh build_release "$PWD" "${{ github.ref_name }}"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: |
            Modbus-Tools-*-linux-x86_64.tar.gz
            Modbus-Tools-*-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
